name: Release Homebrew Package

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse package tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^(.+)-v([0-9][0-9A-Za-z._-]*)$ ]]; then
            echo "Tag must look like <package>-v<version>, for example db-tunnel-v0.1.0" >&2
            exit 1
          fi

          package="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          if [[ ! -d "packages/$package" ]]; then
            echo "No package directory for tag: packages/$package" >&2
            exit 1
          fi

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$package-v$version.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          scripts/package-homebrew-package "${{ steps.tag.outputs.package }}" "${{ steps.tag.outputs.version }}" dist
          sha256="$(sha256sum "dist/${{ steps.tag.outputs.asset }}" | awk '{print $1}')"

          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            "dist/${{ steps.tag.outputs.asset }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${{ steps.tag.outputs.package }} ${{ steps.tag.outputs.version }}"

      - name: Update formula on default branch
        shell: bash
        run: |
          set -euo pipefail

          default_branch="${{ github.event.repository.default_branch }}"

          git fetch origin "$default_branch"
          git checkout "$default_branch"

          scripts/update-formula \
            "${{ steps.tag.outputs.package }}" \
            "${{ steps.tag.outputs.version }}" \
            "${{ steps.archive.outputs.sha256 }}"

          if git diff --quiet -- "Formula/${{ steps.tag.outputs.package }}.rb"; then
            echo "Formula already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${{ steps.tag.outputs.package }}.rb"
          git commit -m "Update ${{ steps.tag.outputs.package }} formula to ${{ steps.tag.outputs.version }}"
          git push origin "$default_branch"
